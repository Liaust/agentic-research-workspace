[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-research-workspace"
version = "0.1.0a1"
description = "Agent-native workspace for the full research lifecycle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.25,<5",
  "PyYAML>=6.0,<7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/Liaust/agentic-research-workspace"
Issues = "https://github.com/Liaust/agentic-research-workspace/issues"
Roadmap = "https://github.com/Liaust/agentic-research-workspace/blob/main/docs/public-roadmap/README.md"

[project.scripts]
research-map = "research_map.cli:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
