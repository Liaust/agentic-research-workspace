name: Public baseline

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.28'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - name: Replay model-free quick start
        run: |
          uv run research-map --version
          uv run python -m research_map.demo --output build/synthetic-study
          uv run research-map search "causation" --graph build/synthetic-study/graph.json
          uv run research-map explore --id LIB-903:atom:causal-limit --graph build/synthetic-study/graph.json --json
          uv run research-map explore --id LIB-901:atom:indicator-response --graph reference_mapping_graph/synthetic-example/graph.json --json
      - run: uv run python -m research_map.development --root . --require-clean
      - run: uv run python scripts/verify-legacy-baseline.py
      - run: uv build
